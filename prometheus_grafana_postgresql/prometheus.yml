global:
  scrape_interval: 10s
  scrape_timeout: 7s
  evaluation_interval: 12s

scrape_configs:
  - job_name: "pg_prisma_backend_api"
    metrics_path: /metrics
    static_configs:
      - targets: ["pg_prisma_api:6002"]
  - job_name: "prometheus"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
